<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Normies Canvas · Occupy NODE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #0e0f10; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict'
  // ── config ────────────────────────────────────────────────────────────────
  var Q = new URLSearchParams(location.search)
  var SURFACE = (Q.get('surface') || '').toLowerCase()
  var DATA_URL = Q.get('data') || '/api/occupy'
  var LIVE_URL = Q.get('live') || '/api/occupy/live' // the painting at the wall, and what was painted at NODE
  var API = Q.get('api') || 'https://api.normies.art' // for RANDOM: any of the living Normies
  var IDLE_MS = 60000 // a visitor who walks away: their drawing is filed (or dropped if empty)
  var CYCLE = Number(Q.get('cycle')) || 12000 // ms per Normie; every surface shares the clock
  var INK = '#0e0f10', PANEL = '#1d1e20', PAPER = '#e3e5e4', STEEL = '#48494b'
  var ADD = '#57d996', DEL = '#9a9c9b', GLOW = '#ffd27a'
  var FONT = "'Chakra Petch', ui-monospace, Menlo, monospace"

  var cv = document.getElementById('c')
  var ctx = cv.getContext('2d')
  var W = 0, H = 0, DPR = 1
  var items = [] // newest first: on-chain edits and visitor drawings together
  var onchain = [], visitors = []
  var tiles = {} // id → offscreen canvas of the current art
  var mosaicLayer = null, mosaicKey = ''

  // ── surface → layout ──────────────────────────────────────────────────────
  // Exhibition 1: the entrance wall is the editor + gallery; walking around the cube reads
  // before → being repainted → on chain → every Normie repainted.
  //   wall: canvas replay + gallery · before: the art as it was · focus: the replay ·
  //   after: the art as it lives on chain · mosaic: the whole gallery
  // Visitors paint at the entrance wall. The cube: side 1 the Legendary Canvases, side 2 customized
  // Normies being repainted, side 3 the wall's painting live, side 4 what was painted at NODE.
  var MODES = { wall: 1, before: 1, focus: 1, after: 1, mosaic: 1, legendary: 1, live: 1, recent: 1 }
  function layout() {
    var forced = (Q.get('mode') || '').toLowerCase()
    if (MODES[forced]) return forced
    if (SURFACE === 'entrance-led') return 'wall'
    if (SURFACE === 'cube-1') return 'legendary'
    if (SURFACE === 'cube-2') return 'focus'
    if (SURFACE === 'cube-3') return 'live'
    if (SURFACE === 'cube-4') return 'recent'
    return W / H >= 1.4 ? 'wall' : 'focus'
  }

  // ── data ──────────────────────────────────────────────────────────────────
  function hexBits(hex, size) {
    var out = new Uint8Array(size * size)
    for (var i = 0; i < hex.length; i++) {
      var v = parseInt(hex[i], 16)
      for (var b = 0; b < 4; b++) {
        var k = i * 4 + b
        if (k < out.length) out[k] = (v >> (3 - b)) & 1
      }
    }
    return out
  }
  function tileFor(it) {
    if (tiles[it.id + ':' + it.ts]) return tiles[it.id + ':' + it.ts]
    var c = document.createElement('canvas')
    c.width = c.height = it.size
    var x = c.getContext('2d')
    x.fillStyle = PAPER; x.fillRect(0, 0, it.size, it.size)
    x.fillStyle = STEEL
    for (var i = 0; i < it.nowBits.length; i++) if (it.nowBits[i]) x.fillRect(i % it.size, (i / it.size) | 0, 1, 1)
    return (tiles[it.id + ':' + it.ts] = c)
  }
  // the grids hold customized Normies only, straight from the Normies API
  var legendary = [] // [{ artist, ids, size, arts: [Uint8Array] }], one per artwork
  function acceptLegendary(list) {
    if (!Array.isArray(list) || !list.length) return
    legendary = list.map(function (l) {
      return { artist: l.artist, ids: l.ids, size: l.size, arts: l.art.map(function (h) { return hexBits(h, l.size) }) }
    })
  }
  function merge() {
    items = onchain.slice().sort(function (a, b) { return b.ts - a.ts })
    playlist = items.filter(function (it) { return it.changes.length >= MIN_CHANGES })
    mosaicKey = ''
  }
  function accept(data) {
    if (data) acceptLegendary(data.legendary)
    if (!data || !Array.isArray(data.items) || !data.items.length) return
    onchain = data.items.map(function (it) {
      it.kind = 'chain'
      it.baseBits = hexBits(it.base, it.size)
      it.nowBits = hexBits(it.now, it.size)
      it.changes = shuffle(it.added.map(function (i) { return [i, 1] }).concat(it.removed.map(function (i) { return [i, 0] })), it.id)
      return it
    })
    merge()
  }
  function load() {
    fetch(DATA_URL, { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null }).then(accept).catch(function () {})
  }
  // ── visitor drawings (the /draw store: base64url, 1 bit per pixel, 40x40 or 80x80) ──
  function b64uToBits(d) {
    var bin = atob(d.replace(/-/g, '+').replace(/_/g, '/'))
    var size = bin.length === 800 ? 80 : bin.length === 200 ? 40 : 0
    if (!size) return null
    var bits = new Uint8Array(size * size)
    for (var i = 0; i < bits.length; i++) bits[i] = (bin.charCodeAt(i >> 3) >> (7 - (i & 7))) & 1
    return { size: size, bits: bits }
  }
  function bitsToB64u(bits) {
    var out = ''
    for (var i = 0; i < bits.length; i += 8) {
      var v = 0
      for (var b = 0; b < 8; b++) v = (v << 1) | (bits[i + b] ? 1 : 0)
      out += String.fromCharCode(v)
    }
    return btoa(out).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')
  }
  function bitsToHex(bits) {
    var out = ''
    for (var i = 0; i < bits.length; i += 4) out += ((bits[i] << 3) | (bits[i + 1] << 2) | (bits[i + 2] << 1) | bits[i + 3]).toString(16)
    return out
  }

  // ── live state shared between the wall and the cube ──────────────────────────────────────────
  // The wall sends its canvas while someone paints (and when they finish); the cube reads it. Same
  // computer: a BroadcastChannel delivers it at once. Otherwise /api/occupy/live relays it.
  var bc = null
  try { bc = new BroadcastChannel('normies-occupy') } catch (_) {}
  var liveState = null, liveSeen = 0, liveTs = 0, recent = [], recentKey = ''
  function takeLive(l) {
    if (!l || !l.bits) { liveState = null; return }
    if (l.ts !== liveTs) { liveTs = l.ts; liveSeen = Date.now() }
    liveState = { bits: hexBits(l.bits, 40), start: hexBits(l.start || '', 40) }
  }
  function takeRecent(list) {
    if (!Array.isArray(list)) return
    var key = list.length + ':' + (list[0] && list[0].ts)
    if (key === recentKey) return
    recentKey = key
    recent = list.filter(function (r) { return r && r.bits }).map(function (r) {
      var it = { kind: 'node', id: 'n' + r.ts, ts: r.ts / 1000, size: 40, nowBits: hexBits(r.bits, 40) }
      return it
    })
    mosaicKey = ''
  }
  if (bc) bc.onmessage = function (e) {
    var m = e.data || {}
    if (m.type === 'live') takeLive({ bits: m.bits, start: m.start, ts: Date.now() })
    else if (m.type === 'idle') liveState = null
    else if (m.type === 'done') { liveState = null; pollLive() }
  }
  function pollLive() {
    fetch(LIVE_URL, { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null }).then(function (d) {
      if (!d) return
      takeLive(d.live)
      takeRecent(d.recent)
    }).catch(function () {})
  }
  function send(msg) {
    if (bc) try { bc.postMessage(msg) } catch (_) {}
    fetch(LIVE_URL, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(msg), keepalive: true }).catch(function () {})
  }
  var sent = { key: '', at: 0 }
  // called every frame on the wall: send the canvas when it changed (at most ~3 times a second),
  // and a heartbeat every 5 s so the cube knows someone is still there
  function publish() {
    if (!ed) return
    var key = bitsToHex(ed.bits), t = Date.now()
    if ((key !== sent.key && t - sent.at > 330) || t - sent.at > 5000) {
      sent = { key: key, at: t }
      send({ type: 'live', bits: key, start: bitsToHex(ed.start) })
    }
  }
  function endSession(done) {
    if (!ed) return
    var msg = done ? { type: 'done', bits: bitsToHex(ed.bits), start: bitsToHex(ed.start) } : { type: 'idle' }
    sent = { key: '', at: 0 }
    send(msg)
  }

  function hashStr(str) {
    var h = 2166136261
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0 }
    return h
  }
  function visitorItem(d, ts, base) {
    var dec = b64uToBits(d)
    if (!dec) return null
    var n = dec.size, start = base && base.length === n * n ? base : new Uint8Array(n * n)
    var changes = []
    for (var i = 0; i < n * n; i++) if (dec.bits[i] !== start[i]) changes.push([i, dec.bits[i]])
    if (!changes.length) return null
    var h = hashStr(d)
    return { kind: 'visitor', id: 'v' + h.toString(36), d: d, ts: ts, size: n, baseBits: start, nowBits: dec.bits, changes: shuffle(changes, h) }
  }

  function shuffle(a, seed) {
    var s = (seed * 2654435761) >>> 0
    for (var i = a.length - 1; i > 0; i--) {
      s = (s * 1664525 + 1013904223) >>> 0
      var j = s % (i + 1), t = a[i]; a[i] = a[j]; a[j] = t
    }
    return a
  }

  // ── helpers ───────────────────────────────────────────────────────────────
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)) }
  function seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1) }
  function text(str, x, y, size, color, align, weight, ls) {
    ctx.font = (weight || 600) + ' ' + size + 'px ' + FONT
    ctx.fillStyle = color || PAPER
    ctx.textAlign = align || 'left'
    ctx.textBaseline = 'alphabetic'
    if ('letterSpacing' in ctx) ctx.letterSpacing = (ls || 0) + 'px'
    ctx.fillText(str, x, y)
    if ('letterSpacing' in ctx) ctx.letterSpacing = '0px'
  }
  // the font size at which str fits in maxW (never above size)
  function fit(str, maxW, size, weight, ls) {
    ctx.font = (weight || 600) + ' ' + size + 'px ' + FONT
    var w = ctx.measureText(str).width + (ls || 0) * str.length
    return w > maxW ? size * maxW / w : size
  }
  function ago(ts) {
    var s = Math.max(1, Date.now() / 1000 - ts)
    if (s < 3600) return Math.round(s / 60) + ' MIN AGO'
    if (s < 86400) return Math.round(s / 3600) + ' H AGO'
    return Math.round(s / 86400) + ' DAYS AGO'
  }

  function nameOf(it) { return it.kind === 'visitor' ? (it.local ? 'YOUR DRAWING' : 'DRAWN BY A VISITOR') : 'NORMIE #' + it.id }
  function lineOf(it) {
    var n = it.changes.length
    return it.kind === 'visitor'
      ? n + ' PIXEL' + (n === 1 ? '' : 'S') + ' · DRAWN HERE ON THE NORMIES CANVAS · ' + ago(it.ts)
      : n + ' PIXEL' + (n === 1 ? '' : 'S') + ' REPAINTED ON ETHEREUM · ' + ago(it.ts)
  }

  // The playlist is the gallery as it fits on screen; all surfaces read the same clock, so a wall
  // and two pools in the same room show the same Normie at the same moment.
  var spotlight = null // { it, t0 }: a drawing just filed here, replayed once before the clock resumes
  function now() {
    var t = Date.now()
    if (spotlight) {
      if (t - spotlight.t0 < CYCLE) return { it: spotlight.it, idx: items.indexOf(spotlight.it), p: (t - spotlight.t0) / CYCLE }
      spotlight = null
    }
    var list = playlist.length ? playlist : items
    var n = Math.max(1, Math.min(list.length, PLAYLIST))
    var it = list[Math.floor(t / CYCLE) % n]
    return { it: it, idx: items.indexOf(it), p: (t % CYCLE) / CYCLE }
  }
  var fitCount = 0
  var PLAYLIST = 120 // newest edits on the clock; the same number on every surface keeps them in step
  // Edits of a pixel or two look the same before and after on the cube, so the clock only plays
  // Normies with a visible repaint. Every customized Normie still shows in the grids.
  var MIN_CHANGES = Number(Q.get('min')) || 12
  var playlist = []

  // ── the canvas being repainted ────────────────────────────────────────────
  // 0–.08 the art as it was · .08–.62 each changed pixel lands, added green, removed grey (the
  // editor's DIFF view) · .62–.78 hold · .78–.86 diff off: the art as it lives on chain · hold.
  function drawReplayCells(it, p, x, y, s, opts) {
    opts = opts || {}
    var n = it.size, px = s / n
    var shown = Math.floor(it.changes.length * seg(p, 0.08, 0.62))
    var diff = p < 0.82
    var cells = new Uint8Array(it.baseBits)
    var mark = new Int8Array(n * n) // 1 added, -1 removed
    for (var k = 0; k < shown; k++) {
      var c = it.changes[k]
      cells[c[0]] = c[1]
      mark[c[0]] = c[1] ? 1 : -1
    }
    ctx.fillStyle = PAPER
    ctx.fillRect(x, y, s, s)
    for (var i = 0; i < n * n; i++) {
      var m = diff ? mark[i] : 0
      if (!cells[i]) continue // removed pixels show as empty, like the chain
      ctx.fillStyle = m === 1 ? ADD : m === -1 ? DEL : STEEL
      var cx = x + (i % n) * px, cy = y + ((i / n) | 0) * px
      if (m === -1) {
        var inset = px * 0.3
        ctx.fillRect(Math.floor(cx + inset), Math.floor(cy + inset), Math.ceil(px - inset * 2), Math.ceil(px - inset * 2))
      } else {
        ctx.fillRect(Math.floor(cx), Math.floor(cy), Math.ceil(px), Math.ceil(px))
      }
    }
    // the newest stroke, a beat brighter
    if (diff && shown > 0 && shown < it.changes.length) {
      var last = it.changes[shown - 1][0]
      ctx.strokeStyle = GLOW; ctx.lineWidth = Math.max(1, px * 0.18)
      ctx.strokeRect(x + (last % n) * px, y + ((last / n) | 0) * px, px, px)
    }
    if (opts.grid && px >= 6) {
      ctx.strokeStyle = 'rgba(14,15,16,0.08)'; ctx.lineWidth = 1
      ctx.beginPath()
      for (var g = 1; g < n; g++) {
        ctx.moveTo(Math.round(x + g * px) + 0.5, y); ctx.lineTo(Math.round(x + g * px) + 0.5, y + s)
        ctx.moveTo(x, Math.round(y + g * px) + 0.5); ctx.lineTo(x + s, Math.round(y + g * px) + 0.5)
      }
      ctx.stroke()
    }
  }

  // Pixels are drawn at whole-number size on a small offscreen canvas, then scaled up with smoothing
  // off. Drawing fractional-size cells straight onto the screen left hairline seams between them.
  var CELL = 12, off = document.createElement('canvas'), offCtx = off.getContext('2d')
  function seamless(n, x, y, s, draw) {
    var k = n * CELL
    if (off.width !== k) { off.width = off.height = k }
    var main = ctx
    ctx = offCtx
    ctx.setTransform(1, 0, 0, 1, 0, 0)
    ctx.clearRect(0, 0, k, k)
    try { draw(k) } finally { ctx = main }
    ctx.save()
    ctx.imageSmoothingEnabled = false
    ctx.drawImage(off, Math.round(x), Math.round(y), Math.round(s), Math.round(s))
    ctx.restore()
  }
  function drawReplay(it, p, x, y, s, opts) { seamless(it.size, x, y, s, function (k) { drawReplayCells(it, p, 0, 0, k, opts) }) }
  function drawEditing(x, y, s) { var r = ed.rect; seamless(ed.size, x, y, s, function (k) { drawEditingCells(0, 0, k) }); ed.rect = r }
  function drawBits(bits, n, x, y, s) { seamless(n, x, y, s, function (k) { drawBitsCells(bits, n, 0, 0, k) }) }

  // ── gallery ───────────────────────────────────────────────────────────────
  // largest square tile that fits the area with every item, or as many items as fit at a readable size
  function grid(w, h, count) {
    var best = { cols: 1, rows: 1, s: Math.min(w, h) }
    for (var cols = 1; cols <= count; cols++) {
      var s = w / cols, rows = Math.ceil(count / cols)
      if (rows * s > h) s = h / rows
      if (s > best.s || best.cols === 1 && cols === 1) best = { cols: cols, rows: rows, s: s }
      if (s < best.s && rows * s <= h) break
    }
    var minS = Math.max(18, Math.min(w, h) / 60)
    if (best.s < minS) {
      var c2 = Math.floor(w / minS), r2 = Math.floor(h / minS)
      best = { cols: c2, rows: r2, s: Math.min(w / c2, h / r2) }
    }
    return best
  }
  function drawMosaic(x, y, w, h, cur) {
    var g = grid(w, h, items.length)
    fitCount = Math.min(items.length, g.cols * g.rows)
    var gap = Math.max(1, Math.round(g.s * 0.06))
    var ox = x + (w - g.cols * g.s) / 2, oy = y + (h - g.rows * g.s) / 2
    var key = [items.length, items[0] && items[0].ts, visitors.length, Math.round(w), Math.round(h)].join(':')
    if (key !== mosaicKey) {
      mosaicLayer = document.createElement('canvas')
      mosaicLayer.width = Math.ceil(w); mosaicLayer.height = Math.ceil(h)
      var m = mosaicLayer.getContext('2d')
      m.imageSmoothingEnabled = false
      for (var i = 0; i < fitCount; i++) {
        var tx = ox - x + (i % g.cols) * g.s, ty = oy - y + Math.floor(i / g.cols) * g.s
        m.drawImage(tileFor(items[i]), Math.round(tx + gap / 2), Math.round(ty + gap / 2), Math.round(g.s - gap), Math.round(g.s - gap))
        if (items[i].kind === 'visitor') {
          m.fillStyle = GLOW
          m.fillRect(Math.round(tx + gap / 2), Math.round(ty + gap / 2), Math.max(3, g.s * 0.14), Math.max(3, g.s * 0.14))
        }
      }
      mosaicKey = key
    }
    ctx.drawImage(mosaicLayer, x, y)
    if (cur && cur.idx >= 0 && cur.idx < fitCount) {
      var cx = ox + (cur.idx % g.cols) * g.s, cy = oy + Math.floor(cur.idx / g.cols) * g.s
      var pulse = 0.55 + 0.45 * Math.sin(Date.now() / 260)
      ctx.fillStyle = 'rgba(14,15,16,0.55)'
      ctx.fillRect(cx + gap / 2, cy + gap / 2, g.s - gap, g.s - gap)
      // the tile fills in as the canvas finishes
      if (cur.p > 0.78) {
        ctx.save(); ctx.globalAlpha = seg(cur.p, 0.78, 0.9)
        ctx.imageSmoothingEnabled = false
        ctx.drawImage(tileFor(cur.it), cx + gap / 2, cy + gap / 2, g.s - gap, g.s - gap)
        ctx.restore()
      }
      ctx.strokeStyle = GLOW; ctx.globalAlpha = pulse; ctx.lineWidth = Math.max(3, g.s * 0.1)
      ctx.strokeRect(cx + gap / 2, cy + gap / 2, g.s - gap, g.s - gap)
      ctx.globalAlpha = 1
    }
  }

  // ── layouts ───────────────────────────────────────────────────────────────
  function renderWall(cur) {
    var u = Math.min(W / 16, H / 9) // one unit of a 16:9 frame, so type scales on any wall
    var pad = u * 0.45
    var leftW = Math.min(H - pad * 2, W * 0.42)
    var px0 = pad, py0 = pad, pw = leftW, ph = H - pad * 2
    editorPanel(cur, px0, py0, pw, ph, u)
    // gallery
    var gx = px0 + pw + pad, gy = pad, gw = W - gx - pad, gh = H - pad * 2
    ctx.fillStyle = PAPER; ctx.fillRect(gx, gy, gw, gh)
    var inner = Math.max(4, u * 0.1)
    ctx.fillStyle = INK; ctx.fillRect(gx + inner, gy + inner, gw - inner * 2, gh - inner * 2)
    var head = u * 0.5
    var hw = gw - inner * 2 - u * 0.4
    var right = onchain.length + ' NORMIES REPAINTED ON ETHEREUM · LIVE'
    var hs = Math.min(fit('THE NORMIES WALL', hw * 0.4, u * 0.2, 700), fit(right, hw * 0.55, u * 0.2, 600))
    text('THE NORMIES WALL', gx + inner + u * 0.2, gy + inner + head * 0.7, hs, PAPER, 'left', 700)
    text(right, gx + gw - inner - u * 0.2, gy + inner + head * 0.7, hs * 0.85, 'rgba(227,229,228,0.55)', 'right', 600)
    drawMosaic(gx + inner + u * 0.12, gy + inner + head, gw - inner * 2 - u * 0.24, gh - inner * 2 - head - u * 0.12, cur)
  }
  // ── the editor: replaying on its own, or painted by a visitor with the mouse ─────────────────
  var HITS = [] // clickable regions this frame: { x, y, w, h, fn }
  var ed = null // the visitor's session, or null while the canvas replays the wall
  var notice = null // { msg, t0 }
  var FINE = window.matchMedia && matchMedia('(any-pointer: fine)').matches
  function hit(x, y, w, h, fn) { HITS.push({ x: x, y: y, w: w, h: h, fn: fn }) }
  function btnW(label, fs) {
    ctx.font = '700 ' + fs + 'px ' + FONT
    return ctx.measureText(label).width + label.length * fs * 0.1 + fs * 1.3
  }
  function button(label, x, y, h, fs, on, fn, color) {
    var w = btnW(label, fs)
    if (on) { ctx.fillStyle = color || PAPER; ctx.fillRect(x, y, w, h) }
    else if (fn) { ctx.strokeStyle = 'rgba(227,229,228,0.18)'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1) }
    text(label, x + fs * 0.65, y + h * 0.7, fs, on ? INK : fn ? 'rgba(227,229,228,0.8)' : 'rgba(227,229,228,0.45)', 'left', 700, fs * 0.1)
    if (fn) hit(x, y, w, h, fn)
    return w
  }
  // every visitor starts on a blank 40x40; RANDOM brings in a Normie to repaint instead
  function startEditing() {
    ed = { size: 40, start: new Uint8Array(1600), bits: new Uint8Array(1600), from: '', grid: false, diff: false,
      undo: [], redo: [], last: Date.now(), down: false, prev: -1, val: 1, saving: false, rect: null, loading: false }
  }
  function useNormie(id, bits) {
    if (!ed) return
    snapshot()
    ed.start = new Uint8Array(bits); ed.bits = new Uint8Array(bits)
    ed.from = 'NORMIE #' + id; ed.diff = true; ed.loading = false
  }
  function randomNormie() {
    if (!ed || ed.loading) return
    ed.loading = true
    var tries = 0
    ;(function attempt() {

    ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H)
    var lay = layout()
    if (lay === 'wall') publish()
    if (lay === 'legendary') {
      renderLegendary()
    } else if (lay === 'live') {
      renderLive()
    } else if (lay === 'recent') {
      renderRecent()
    } else if (ed && lay !== 'wall') {
      var m = Math.min(W, H), u = Math.min(W / 9, H / 10)
      var pw = Math.min(W - m * 0.06, (H - m * 0.06) * 0.9)
      editorPanel(now(), (W - pw) / 2, m * 0.03, pw, H - m * 0.06, u)
    } else if (!items.length) {
      text('NORMIES', W / 2, H / 2, Math.min(W, H) * 0.06, 'rgba(227,229,228,0.35)', 'center', 700, Math.min(W, H) * 0.01)
    } else {
      var mode = layout()
      var cur = now()
      if (mode === 'wall') renderWall(cur)
      else if (mode === 'mosaic') renderMosaic(cur)
      else renderSingle(cur, mode)
    }
    drawNotice()
    requestAnimationFrame(frame)
  }
  window.addEventListener('resize', resize)
  resize()
  load()
  setInterval(load, 60000)
  // cube-3 checks often (a painting in progress), cube-4 now and then (finished drawings)
  ;(function loop() {
    var lay = layout()
    if (lay === 'live' || lay === 'recent') pollLive()
    setTimeout(loop, lay === 'live' ? 1000 : 4000)
  })()
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { mosaicKey = '' })
  requestAnimationFrame(frame)
  window.__occupy = { accept: accept, layout: layout }
})()
</script>
